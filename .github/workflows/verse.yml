name: Verse

on:
  push:
    branches: [main, 'claude/**']
    paths: ['liner-plus/**', '.github/workflows/verse.yml']
    # Pushing a tag like verse/v0.1.0 builds everything and publishes a GitHub Release.
    # (Not v*: that prefix belongs to the Breakpoint workflow.)
    tags: ['verse/v*']
  pull_request:
    paths: ['liner-plus/**', '.github/workflows/verse.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: liner-plus

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: liner-plus/package-lock.json
      - name: Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: liner-plus/src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Browser smoke test (mock source)
        run: npx playwright install --with-deps chromium && npm run smoke

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-14
            bundles: dmg
            args: --target universal-apple-darwin
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: liner-plus/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: liner-plus/src-tauri
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: Verse-${{ runner.os }}
          path: |
            liner-plus/src-tauri/target/**/release/bundle/deb/*.deb
            liner-plus/src-tauri/target/**/release/bundle/appimage/*.AppImage
            liner-plus/src-tauri/target/**/release/bundle/dmg/*.dmg
            liner-plus/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/verse/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - id: version
        run: echo "version=${GITHUB_REF_NAME#verse/v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: Verse ${{ steps.version.outputs.version }}
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*-setup.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage
          body: |
            Desktop player for YouTube Music with karaoke-synced lyrics. Unofficial and not affiliated with YouTube or Google.

            **Pre-release:** this version hasn't been tested against live YouTube yet. If something fails, report the error message.

            ### Install

            **macOS** (Apple Silicon + Intel): download `Verse_${{ steps.version.outputs.version }}_universal.dmg`, open it and drag Verse into Applications. The app isn't signed, so the first launch is blocked. Go to **System Settings → Privacy & Security → Open Anyway**, or run `xattr -dr com.apple.quarantine /Applications/Verse.app`.

            **Windows:** run `Verse_${{ steps.version.outputs.version }}_x64-setup.exe`. When SmartScreen warns, click **More info → Run anyway**.

            **Linux:** `sudo apt install ./Verse_*.deb`, or `chmod +x` the `.AppImage` and run it. For audio, install `gstreamer1.0-plugins-good` and `gstreamer1.0-libav`.

            ### Required: Deno

            yt-dlp needs a JavaScript runtime to get YouTube audio. Install [Deno](https://deno.land): `brew install deno` (macOS), `winget install DenoLand.Deno` (Windows) or `curl -fsSL https://deno.land/install.sh | sh` (Linux). Verse downloads and updates yt-dlp by itself.
