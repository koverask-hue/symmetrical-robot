[package]
name = "verse"
version = "0.1.0"
description = "Small, fast desktop player for YouTube Music with karaoke-synced lyrics."
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "verse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-http = { version = "2.8", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "sync", "time", "macros", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2"] }
futures-util = { version = "0.3", default-features = false }
url = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
